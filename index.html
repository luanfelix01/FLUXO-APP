function ptErr(j,st){const m=String(j&&(j.msg||j.error_description||j.message||j.error)||"");

 if(/same password/i.test(m))return"Use uma senha diferente da atual.";if(/password should be|weak/i.test(m))return"Senha fraca. Use 8 caracteres ou mais.";

async function sbReq(path,o={}){if(!SB.url)throw new Error("Contas ainda não configuradas.");const sess=o.auth!==false&&SES;
 if(sess&&SES.exp-Date.now()<6e4)await refresh();

 if(r.status==401&&sess&&!o.retry){await refresh();return sbReq(path,{...o,retry:1})}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){const x=new Error(ptErr(j,r.status));x.status=r.status;throw x}return j}

 const la=a.lic,lb=b.lic;o.lic=la&&(!lb||la.until>=lb.until)?la:lb;o.seen=[...new Set([...(a.seen||[]),...(b.seen||[])])];o.lim={...(b.lim||{}),...(a.lim||{})};o.set={...(b.set||{}),...(a.set||{})};o.sv=a.sv;return o}
